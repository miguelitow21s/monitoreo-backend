name: Dispatch email notifications

# Scheduled dispatcher for the email queue. Without it, queued mails only go out
# on the best-effort inline waitUntil and the "shift not started" overdue alerts
# never fire. Authenticates with CRON_DISPATCH_SECRET (no user session), which
# email_notifications_dispatch validates in constant time and only honours when
# the secret is configured on the Supabase side.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: dispatch-emails
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Dispatch pending emails + overdue alerts
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_DISPATCH_SECRET: ${{ secrets.CRON_DISPATCH_SECRET }}
        run: |
          set -euo pipefail
          BASE="${SUPABASE_URL%/}"
          if [ -z "${CRON_DISPATCH_SECRET:-}" ]; then
            echo "CRON_DISPATCH_SECRET is not set in the prod environment"; exit 1
          fi
          HTTP=$(curl -sS -o /tmp/resp -w "%{http_code}" -X POST "$BASE/functions/v1/email_notifications_dispatch" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "x-cron-secret: $CRON_DISPATCH_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"enqueue_shift_not_started":true,"dispatch_limit":30,"max_attempts":5,"daily_cap":200}')
          echo "HTTP $HTTP"; cat /tmp/resp
          [ "$HTTP" = "200" ]
